name: Apply P1 hardening

on:
  push:
    branches: [backend/mvp-production-hardening]

permissions:
  contents: write

a jobs:
  harden:
    if: github.event.head_commit.message != 'chore: remove P1 hardening runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch operational scope enforcement
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found: {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          replace('backend/apps/scheduling/views.py',
              'from apps.tenancy.services import active_membership_for, require_permission',
              'from apps.tenancy.services import active_membership_for, require_permission, require_scoped_permission, scoped_queryset')

          replace('backend/apps/scheduling/views.py',
              '    def initial(self, request, *args, **kwargs):\n        super().initial(request, *args, **kwargs)\n        _, membership = self.organization_and_membership()\n        permission = (\n            self.manage_permission\n            if request.method in ("POST", "PUT", "PATCH")\n            else self.view_permission\n        )\n        require_permission(membership, permission)\n',
              '    def initial(self, request, *args, **kwargs):\n        super().initial(request, *args, **kwargs)\n        _, membership = self.organization_and_membership()\n        permission = (\n            self.manage_permission\n            if request.method in ("POST", "PUT", "PATCH", "DELETE")\n            else self.view_permission\n        )\n        require_permission(membership, permission)\n        self._enforce_url_scope(membership, permission)\n\n    def filter_queryset(self, queryset):\n        queryset = super().filter_queryset(queryset)\n        model_name = queryset.model._meta.model_name\n        supported = {\n            "trip", "ticket", "booking", "seatlock", "boardingrecord",\n            "cashsettlement", "cargoshipment", "paymentrecord",\n        }\n        if model_name in supported:\n            _, membership = self.organization_and_membership()\n            permission = self.view_permission if self.request.method == "GET" else self.manage_permission\n            return scoped_queryset(membership, queryset, permission)\n        return queryset\n\n    def _enforce_url_scope(self, membership, permission):\n        from django.shortcuts import get_object_or_404\n        from apps.bookings.models import Booking, SeatLock\n        from apps.cargo.models import CargoShipment\n        from apps.operations.models import CashSettlement\n        from apps.scheduling.models import Trip\n        from apps.ticketing.models import Ticket\n        mapping = {\n            "trip_id": (Trip, "trip"),\n            "booking_id": (Booking, "booking"),\n            "ticket_id": (Ticket, "ticket"),\n            "lock_id": (SeatLock, "seatlock"),\n            "settlement_id": (CashSettlement, "cashsettlement"),\n            "shipment_id": (CargoShipment, "cargoshipment"),\n        }\n        for kwarg, (model, _) in mapping.items():\n            value = self.kwargs.get(kwarg)\n            if value is None:\n                continue\n            organization, _ = self.organization_and_membership()\n            obj = get_object_or_404(model, pk=value, organization=organization)\n            if model is Trip:\n                resource = obj\n            elif model is Booking:\n                resource = obj\n            elif model is Ticket:\n                resource = obj\n            elif model is SeatLock:\n                resource = obj\n            elif model is CashSettlement:\n                resource = obj\n            elif model is CargoShipment:\n                resource = obj\n            else:\n                continue\n            require_scoped_permission(membership, permission, resource)\n            break\n')

          replace('backend/apps/bookings/views.py',
              'from apps.scheduling.views import OrganizationSchedulingMixin\n',
              'from apps.scheduling.views import OrganizationSchedulingMixin, require_trip_scope\n')

          replace('backend/apps/bookings/views.py',
              '        trip = get_object_or_404(\n            Trip,\n            pk=serializer.validated_data["trip_id"],\n            organization=organization,\n            status__in=[Trip.Status.PLANNED, Trip.Status.READY],\n        )\n',
              '        trip = get_object_or_404(\n            Trip,\n            pk=serializer.validated_data["trip_id"],\n            organization=organization,\n            status__in=[Trip.Status.PLANNED, Trip.Status.READY],\n        )\n        _, membership = self.organization_and_membership()\n        require_trip_scope(membership, trip, self.manage_permission)\n')

          replace('backend/apps/bookings/views.py',
              '        trip = get_object_or_404(Trip, pk=trip_id, organization=organization)\n        locks = active_locks_for_trip(organization=organization, trip=trip)\n',
              '        trip = get_object_or_404(Trip, pk=trip_id, organization=organization)\n        _, membership = self.organization_and_membership()\n        require_trip_scope(membership, trip, self.view_permission)\n        locks = active_locks_for_trip(organization=organization, trip=trip)\n')

          replace('backend/apps/bookings/views.py',
              '        lock = get_object_or_404(\n            SeatLock, pk=lock_id, organization=organization\n        )\n        release_seat_lock(lock=lock, actor=request.user)\n',
              '        lock = get_object_or_404(\n            SeatLock, pk=lock_id, organization=organization\n        )\n        _, membership = self.organization_and_membership()\n        require_trip_scope(membership, lock.trip, self.manage_permission)\n        release_seat_lock(lock=lock, actor=request.user)\n')

          replace('backend/apps/bookings/views.py',
              '        lock = get_object_or_404(\n            SeatLock, pk=lock_id, organization=organization\n        )\n        lock, conflict = extend_seat_lock(lock=lock, actor=request.user)\n',
              '        lock = get_object_or_404(\n            SeatLock, pk=lock_id, organization=organization\n        )\n        _, membership = self.organization_and_membership()\n        require_trip_scope(membership, lock.trip, self.manage_permission)\n        lock, conflict = extend_seat_lock(lock=lock, actor=request.user)\n')

          replace('backend/apps/bookings/views.py',
              '        trip = get_object_or_404(\n            Trip.objects.select_related("seat_layout"),\n            pk=trip_id,\n            organization=organization,\n            status__in=[Trip.Status.PLANNED, Trip.Status.READY],\n        )\n        if trip.seat_layout_id is None:\n',
              '        trip = get_object_or_404(\n            Trip.objects.select_related("seat_layout"),\n            pk=trip_id,\n            organization=organization,\n            status__in=[Trip.Status.PLANNED, Trip.Status.READY],\n        )\n        _, membership = self.organization_and_membership()\n        require_trip_scope(membership, trip, self.view_permission)\n        if trip.seat_layout_id is None:\n')

          replace('backend/apps/bookings/views.py',
              '        booking = get_object_or_404(\n            Booking, pk=booking_id, organization=organization\n        )\n        serializer = BookingActionSerializer(\n',
              '        booking = get_object_or_404(\n            Booking, pk=booking_id, organization=organization\n        )\n        _, membership = self.organization_and_membership()\n        require_trip_scope(membership, booking.trip, self.manage_permission)\n        serializer = BookingActionSerializer(\n')

          replace('backend/apps/operations/views.py',
              'from apps.scheduling.views import OrganizationSchedulingMixin, require_trip_scope\n',
              'from apps.scheduling.views import OrganizationSchedulingMixin, require_trip_scope\nfrom apps.tenancy.services import scoped_queryset\n')

          replace('backend/apps/operations/views.py',
              '        rows = self._rows(organization, report, start, end)\n',
              '        _, membership = self.organization_and_membership()\n        rows = self._rows(organization, membership, report, start, end)\n')

          replace('backend/apps/operations/views.py',
              '    def _rows(organization, report, start, end):\n',
              '    def _rows(organization, membership, report, start, end):\n')

          replace('backend/apps/operations/views.py',
              '            for trip in Trip.objects.filter(organization=organization, service_date__range=(start, end)).order_by("service_date", "planned_departure_at"):\n',
              '            for trip in scoped_queryset(membership, Trip.objects.filter(organization=organization, service_date__range=(start, end)), "report.owner").order_by("service_date", "planned_departure_at"):\n')

          replace('backend/apps/operations/views.py',
              '            for payment in PaymentRecord.objects.filter(organization=organization, status=PaymentRecord.Status.CONFIRMED, confirmed_at__date__range=(start, end)).order_by("confirmed_at"):\n',
              '            for payment in scoped_queryset(membership, PaymentRecord.objects.filter(organization=organization, status=PaymentRecord.Status.CONFIRMED, confirmed_at__date__range=(start, end)), "report.owner").order_by("confirmed_at"):\n')

          replace('backend/apps/operations/views.py',
              '            for shipment in CargoShipment.objects.filter(organization=organization, created_at__date__range=(start, end)).order_by("created_at"):\n',
              '            for shipment in scoped_queryset(membership, CargoShipment.objects.filter(organization=organization, created_at__date__range=(start, end)), "report.owner").order_by("created_at"):\n')

          replace('backend/apps/operations/views.py',
              '        trips = Trip.objects.filter(organization=organization, service_date__range=(start, end))\n        tickets = Ticket.objects.filter(organization=organization, trip__service_date__range=(start, end)).exclude(status=Ticket.Status.CANCELLED)\n        cargo = CargoShipment.objects.filter(organization=organization, created_at__date__range=(start, end))\n        payments = PaymentRecord.objects.filter(organization=organization, status=PaymentRecord.Status.CONFIRMED, confirmed_at__date__range=(start, end))\n',
              '        trips = scoped_queryset(membership, Trip.objects.filter(organization=organization, service_date__range=(start, end)), "report.owner")\n        tickets = scoped_queryset(membership, Ticket.objects.filter(organization=organization, trip__service_date__range=(start, end)).exclude(status=Ticket.Status.CANCELLED), "report.owner")\n        cargo = scoped_queryset(membership, CargoShipment.objects.filter(organization=organization, created_at__date__range=(start, end)), "report.owner")\n        payments = scoped_queryset(membership, PaymentRecord.objects.filter(organization=organization, status=PaymentRecord.Status.CONFIRMED, confirmed_at__date__range=(start, end)), "report.owner")\n')
          PY
      - name: Run backend verification
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput
          pip check
          pip-audit
          bandit -q -r apps
          semgrep --config p/python --error apps
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/apps
          git commit -m 'fix: enforce operational scope across P1 endpoints' || exit 0
          git push
      - name: Remove runner workflow
        run: |
          git rm .github/workflows/p1-hardening-apply.yml
          git commit -m 'chore: remove P1 hardening runner'
          git push
