name: flutter-ci

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.29.2"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hbt_business_app, hbt_passenger_app]
    defaults:
      run:
        working-directory: flutter/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Verify pubspec dependencies
        run: dart pub deps
