# HBT Production nginx Configuration
# Expected path: /etc/nginx/sites-available/hbt-production

upstream hbt-backend {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
    # Add additional backend instances for zero-downtime deploy:
    # server backend-new:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name api.hoboplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.hoboplatform.com;

    # SSL (configure with certbot or manual certs)
    ssl_certificate     /etc/ssl/certs/hoboplatform.crt;
    ssl_certificate_key /etc/ssl/private/hoboplatform.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request limits
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API
    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://hbt-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # CORS headers for preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # Admin
    location /admin/ {
        proxy_pass http://hbt-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no rate limit)
    location /api/v1/health/ {
        proxy_pass http://hbt-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # OpenAPI schema and docs
    location /api/schema/ {
        proxy_pass http://hbt-backend;
        proxy_set_header Host $host;
    }

    location /api/docs/ {
        proxy_pass http://hbt-backend;
        proxy_set_header Host $host;
    }

    # Metrics (internal only)
    location /metrics/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://hbt-backend;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ (\.env|\.git|\.sql|\.bak|config\.json)$ {
        deny all;
        return 404;
    }

    # Root
    location / {
        return 404;
    }
}
