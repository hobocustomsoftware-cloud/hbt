          - $ref: '#/components/schemas/BookingStatus'
          readOnly: true
        contact_name:
          type: string
          maxLength: 255
        contact_phone:
          type: string
          maxLength: 32
        pickup_stop:
          type: string
          format: uuid
        dropoff_stop:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        authorization_reference:
          type: string
          readOnly: true
        notes:
          type: string
        client_request_id:
          type: string
          format: uuid
          nullable: true
        passenger_items:
          type: array
          items:
