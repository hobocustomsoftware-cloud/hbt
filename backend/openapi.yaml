      - booking_number
      - booking_type
      - channel
      - confirmed_at
      - contact_name
      - contact_phone
      - created_at
      - created_by
      - customer_account
      - dropoff_stop
      - id
      - organization_id
      - passenger_items
      - pickup_stop
      - status
      - trip
      - updated_at
