components:
  schemas:
    AcceptanceChannelEnum:
      enum:
      - counter
      - terminal
      - roadside
      - conductor
      - agent
      type: string
      description: |-
        * `counter` - Counter
        * `terminal` - Terminal cargo desk
        * `roadside` - Roadside
        * `conductor` - Conductor
        * `agent` - Agent
    AccountTypeEnum:
      enum:
      - merchant
      - personal
      type: string
      description: |-
        * `merchant` - Merchant account
        * `personal` - Approved personal wallet
    AdvertiserAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        business_name:
          type: string
          maxLength: 255
        contact_phone:
          type: string
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        registration_number:
          type: string
          maxLength: 100
        status:
          allOf:
          - $ref: '#/components/schemas/AdvertiserAccountStatusEnum'
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        owner:
          type: string
          format: uuid
          readOnly: true
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - business_name
      - contact_phone
      - created_at
      - id
      - owner
      - reviewed_at
      - reviewed_by
      - status
      - updated_at
    AdvertiserAccountRequest:
      type: object
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 255
        contact_phone:
          type: string
          minLength: 1
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        registration_number:
          type: string
          maxLength: 100
      required:
      - business_name
      - contact_phone
    AdvertiserAccountStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      - suspended
      type: string
      description: |-
        * `pending` - Pending review
        * `verified` - Verified
        * `rejected` - Rejected
        * `suspended` - Suspended
    AdvertiserReviewRequest:
      type: object
      properties:
        approve:
          type: boolean
      required:
      - approve
    AuthorizationSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        membership:
          type: string
          format: uuid
          readOnly: true
        permissions:
          readOnly: true
        scopes:
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - device
      - expires_at
      - id
      - issued_at
      - membership
      - organization
      - permissions
      - revoked_at
      - scopes
    AvailabilityEnum:
      enum:
      - available
      - assigned
      - on_duty
      - off_duty
      - leave
      - suspended
      - retired
      type: string
      description: |-
        * `available` - Available
        * `assigned` - Assigned
        * `on_duty` - On duty
        * `off_duty` - Off duty
        * `leave` - Leave
        * `suspended` - Suspended
        * `retired` - Retired
    BillingCycleEnum:
      enum:
      - monthly
      - annual
      type: string
      description: |-
        * `monthly` - Monthly
        * `annual` - Annual
    BlankEnum:
      enum:
      - ''
    BoardPassengerRequest:
      type: object
      properties:
        notes:
          type: string
    BoardingRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
          readOnly: true
        ticket:
          type: string
          format: uuid
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        passenger:
          type: string
          format: uuid
          readOnly: true
        passenger_name:
          type: string
          readOnly: true
        seat_identifier:
          type: string
          readOnly: true
        boarding_type:
          allOf:
          - $ref: '#/components/schemas/BoardingTypeEnum'
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/BoardingValidationMethod'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BoardingRecordStatusEnum'
          readOnly: true
        boarding_stop:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        validated_at:
          type: string
          format: date-time
          readOnly: true
        boarded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        validated_by:
          type: string
          format: uuid
          readOnly: true
        boarded_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        identity_confirmed:
          type: boolean
          readOnly: true
        notes:
          type: string
          readOnly: true
        offline:
          type: boolean
          readOnly: true
        client_event_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - boarded_at
      - boarded_by
      - boarding_stop
      - boarding_type
      - client_event_id
      - created_at
      - id
      - identity_confirmed
      - latitude
      - longitude
      - method
      - notes
      - offline
      - organization
      - passenger
      - passenger_name
      - seat_identifier
      - status
      - ticket
      - ticket_number
      - trip
      - updated_at
      - validated_at
      - validated_by
    BoardingRecordStatusEnum:
      enum:
      - validated
      - boarded
      - rejected
      - cancelled
      - completed
      - no_show
      type: string
      description: |-
        * `validated` - Validated
        * `boarded` - Boarded
        * `rejected` - Rejected
        * `cancelled` - Cancelled
        * `completed` - Completed
        * `no_show` - No show
    BoardingTypeEnum:
      enum:
      - terminal
      - roadside
      - staff
      - emergency
      type: string
      description: |-
        * `terminal` - Terminal
        * `roadside` - Roadside
        * `staff` - Staff
        * `emergency` - Emergency
    BoardingValidationMethod:
      enum:
      - qr
      - barcode
      - manual_ticket
      - passenger_search
      - offline
      type: string
      description: |-
        * `qr` - QR scan
        * `barcode` - Barcode
        * `manual_ticket` - Manual ticket number
        * `passenger_search` - Passenger search
        * `offline` - Offline validation
    BoardingValidationRequest:
      type: object
      properties:
        validation_code:
          type: string
          format: uuid
        boarding_type:
          $ref: '#/components/schemas/BoardingTypeEnum'
        method:
          $ref: '#/components/schemas/BoardingValidationMethod'
        boarding_stop:
          type: string
          format: uuid
          nullable: true
        identity_confirmed:
          type: boolean
          default: false
        notes:
          type: string
        offline:
          type: boolean
          default: false
        client_event_id:
          type: string
          format: uuid
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      required:
      - boarding_type
      - method
      - validation_code
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_id:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
        booking_number:
          type: string
          maxLength: 50
        booking_type:
          $ref: '#/components/schemas/BookingTypeEnum'
        channel:
          $ref: '#/components/schemas/BookingChannel'
        status:
