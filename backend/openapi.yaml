          maximum: 32767
          minimum: 0
          nullable: true
        color:
          type: string
          maxLength: 50
        fuel_type:
          type: string
          maxLength: 50
        passenger_capacity:
          type: integer
          maximum: 32767
          minimum: 0
        cargo_supported:
          type: boolean
        cargo_weight_capacity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          nullable: true
        air_conditioned:
          type: boolean
        wifi_available:
          type: boolean
        gps_available:
          type: boolean
        accessible:
          type: boolean
        status:
          $ref: '#/components/schemas/VehicleStatusEnum'
        branch:
          type: string
          format: uuid
      required:
      - branch
      - category
      - code
      - fleet_number
      - registration_number
    VehicleStatusEnum:
      enum:
      - draft
      - available
      - reserved
      - in_service
      - maintenance
      - out_of_service
      - retired
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `available` - Available
        * `reserved` - Reserved
        * `in_service` - In service
        * `maintenance` - Under maintenance
        * `out_of_service` - Out of service
        * `retired` - Retired
        * `archived` - Archived
    VerificationMethodEnum:
      enum:
      - qr
      - phone
      - otp
      - identity
      - delegated
      type: string
      description: |-
        * `` - Not applicable
        * `qr` - Shipment QR
        * `phone` - Phone confirmation
        * `otp` - One-time code
        * `identity` - Identity check
        * `delegated` - Delegated pickup authorization
    WeightSourceEnum:
      enum:
      - declared
      - measured
      type: string
      description: |-
        * `declared` - Declared
        * `measured` - Measured
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
